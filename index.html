<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lockscreen Calendar & Planner</title>
  <style>
    :root { --ios-bg: #000; --ios-card: rgba(30, 30, 32, 0.75); --ios-border: rgba(255,255,255,0.15); --ios-accent: #0A84FF; --ios-text: #FFF; --ios-subtext: #8E8E93; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--ios-bg); color: var(--ios-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .viewport { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: #111; }
    .phone-stage { height: 86vh; aspect-ratio: 9/19.5; border-radius: 48px; position: relative; overflow: hidden; box-shadow: 0 0 0 4px #2c2c2e; }
    #wallpaperCanvas { width: 100%; height: 100%; object-fit: cover; }
    
    .ios-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
    .dynamic-island { width: 110px; height: 32px; background: #000; border-radius: 20px; margin-top: 10px; }
    .ios-clock { font-size: 70px; font-weight: 700; margin-top: 35px; letter-spacing: -1.5px; color: rgba(255,255,255,0.9); }
    
    .controls-panel { position: fixed; bottom: 0; width: 100%; background: var(--ios-card); backdrop-filter: blur(30px); border-radius: 28px 28px 0 0; padding: 14px 20px 30px; display: flex; flex-direction: column; gap: 12px; z-index: 100; }
    .segmented-tabs { display: flex; background: rgba(0,0,0,0.4); padding: 3px; border-radius: 12px; }
    .tab-btn { flex: 1; padding: 8px 0; border: none; background: transparent; color: var(--ios-subtext); font-weight: 600; border-radius: 9px; }
    .tab-btn.active { background: rgba(255,255,255,0.18); color: #fff; }
    .tab-content { display: none; flex-direction: column; gap: 10px; }
    .tab-content.active { display: flex; }
    
    .control-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .control-row label { font-size: 13px; color: var(--ios-subtext); font-weight: 500; min-width: 75px; }
    input[type="range"] { flex: 1; accent-color: var(--ios-accent); height: 6px; }
    input[type="text"], input[type="date"] { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px; border-radius: 8px; width: 100%; }
    
    .btn-action { background: var(--ios-accent); color: #fff; padding: 14px; border-radius: 14px; border: none; font-weight: 600; font-size: 16px; width: 100%; display: flex; align-items: center; justify-content: center; margin-top: 5px; }
    .btn-small { background: #34C759; color: #fff; padding: 8px 12px; border-radius: 8px; border: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="phone-stage">
      <canvas id="wallpaperCanvas" width="1290" height="2796"></canvas>
      <div class="ios-overlay" id="iosOverlay">
        <div class="dynamic-island"></div>
        <div class="ios-clock">09:41</div>
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="segmented-tabs">
      <button class="tab-btn active" onclick="switchTab('plan')">Kế hoạch</button>
      <button class="tab-btn" onclick="switchTab('design')">Thiết kế</button>
    </div>

    <!-- TAB 1: KẾ HOẠCH (Thêm sự kiện) -->
    <div class="tab-content active" id="tab-plan">
      <div class="control-row">
        <input type="date" id="eventDate" style="flex: 1;">
        <input type="text" id="eventText" placeholder="Ghi chú (Tối đa 7 chữ)" maxlength="12" style="flex: 2;">
        <button class="btn-small" onclick="addEvent()">Lưu</button>
      </div>
      <div style="font-size: 12px; color: #FF9F0A;">* Dữ liệu tự động lưu trên máy. Để xoá, nhập ngày và để trống ô Ghi chú rồi bấm Lưu.</div>
    </div>

    <!-- TAB 2: THIẾT KẾ -->
    <div class="tab-content" id="tab-design">
      <div class="control-row">
        <label>Vị trí Y</label>
        <input type="range" id="posY" min="500" max="1400" value="680" oninput="render()">
      </div>
      <div class="control-row">
        <label>Tháng</label>
        <input type="month" id="monthPicker" onchange="render()">
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadBg(event)">
        <button class="btn-small" style="background: rgba(255,255,255,0.2);" onclick="document.getElementById('fileInput').click()">Đổi Nền</button>
      </div>
    </div>

    <button class="btn-action" id="shareBtn" onclick="exportToLockscreen()">
      ⇡ Cập nhật ra Màn hình khóa
    </button>
  </div>

<script>
const canvas = document.getElementById('wallpaperCanvas');
const ctx = canvas.getContext('2d');
let bgImage = null;
let events = JSON.parse(localStorage.getItem('lockscreen_events') || '{}');

const now = new Date();
document.getElementById('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
document.getElementById('eventDate').value = now.toISOString().split('T')[0];

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${id}`).classList.add('active');
}

function loadBg(e) {
  if (!e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = ev => { const img = new Image(); img.onload = () => { bgImage = img; render(); }; img.src = ev.target.result; };
  reader.readAsDataURL(e.target.files[0]);
}

function addEvent() {
  const dateStr = document.getElementById('eventDate').value;
  const text = document.getElementById('eventText').value.trim();
  if (text) { events[dateStr] = text; } 
  else { delete events[dateStr]; }
  localStorage.setItem('lockscreen_events', JSON.stringify(events));
  render();
}

function render() {
  const [yyyy, mm] = document.getElementById('monthPicker').value.split('-').map(Number);
  const startY = parseInt(document.getElementById('posY').value, 10);
  
  if (bgImage) {
    const scale = Math.max(canvas.width / bgImage.width, canvas.height / bgImage.height);
    const x = (canvas.width - bgImage.width * scale) / 2;
    const y = (canvas.height - bgImage.height * scale) / 2;
    ctx.drawImage(bgImage, x, y, bgImage.width * scale, bgImage.height * scale);
  } else {
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  const baseWidth = 1100, baseHeight = 850, boxX = (canvas.width - baseWidth) / 2, boxY = startY;
  
  // Khung mờ
  ctx.fillStyle = 'rgba(20, 20, 25, 0.4)'; ctx.beginPath(); ctx.roundRect(boxX, boxY, baseWidth, baseHeight, 36); ctx.fill();

  ctx.fillStyle = '#fff'; ctx.font = '700 36px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`THÁNG ${mm} • ${yyyy}`, boxX + 50, boxY + 70);

  const headers = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  const colWidth = (baseWidth - 70) / 7, gridStartX = boxX + 35;
  let curY = boxY + 130;

  ctx.font = '600 22px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center';
  headers.forEach((h, i) => ctx.fillText(h, gridStartX + i * colWidth + colWidth / 2, curY));

  curY += 45;
  const totalDays = new Date(yyyy, mm, 0).getDate();
  let col = (new Date(yyyy, mm - 1, 1).getDay() + 6) % 7, rowY = curY;

  for (let d = 1; d <= totalDays; d++) {
    const cellX = gridStartX + col * colWidth + colWidth / 2;
    const isToday = (d === now.getDate() && mm === (now.getMonth()+1) && yyyy === now.getFullYear());
    const dateKey = `${yyyy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    if (isToday) { ctx.fillStyle = '#0A84FF'; ctx.beginPath(); ctx.arc(cellX, rowY - 10, 32, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; }
    else { ctx.fillStyle = '#fff'; }

    ctx.font = isToday ? '700 34px sans-serif' : '500 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d, cellX, rowY);

    // VẼ SỰ KIỆN NẾU CÓ
    if (events[dateKey]) {
      ctx.fillStyle = '#32D74B'; // Màu xanh lá dạ quang cho sự kiện
      ctx.font = '600 16px sans-serif';
      ctx.fillText(events[dateKey], cellX, rowY + 25);
    }

    col++; if (col > 6) { col = 0; rowY += 105; } // Nới rộng dòng để đủ chỗ ghi chú
  }
}

// XUẤT ẢNH BẰNG SHARE SHEET IOS NATIVE
function exportToLockscreen() {
  document.getElementById('iosOverlay').style.display = 'none';
  setTimeout(() => {
    canvas.toBlob(blob => {
      const file = new File([blob], "lockscreen_calendar.png", { type: "image/png" });
      if (navigator.share && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: 'Cập nhật lịch',
          text: 'Lịch màn hình khóa mới'
        }).then(() => {
          document.getElementById('iosOverlay').style.display = 'flex';
        }).catch(err => { console.log(err); document.getElementById('iosOverlay').style.display = 'flex'; });
      } else {
        // Fallback nếu chạy trên máy tính
        const a = document.createElement('a'); a.download = "lockscreen.png"; a.href = canvas.toDataURL(); a.click();
        document.getElementById('iosOverlay').style.display = 'flex';
      }
    });
  }, 100);
}

window.onload = render;
</script>
</body>
</html>
