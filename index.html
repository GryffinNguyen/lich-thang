<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lockscreen Week & Agenda Planner</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --card2: #2C2C2E;
      --accent: #0A84FF;
      --green: #30D158;
      --text: #FFFFFF;
      --sub: #8E8E93;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* THANH CHUYỂN MÀN HÌNH + NÚT XUẤT NHANH 1 CHẠM */
    .top-nav {
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px 10px;
      background: var(--card);
      border-bottom: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 50;
    }
    .mode-switch {
      display: flex;
      background: #000;
      padding: 3px;
      border-radius: 12px;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: var(--sub);
      font-size: 13px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--card2);
      color: #FFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* THANH HÀNH ĐỘNG SIÊU TỐC NGAY ĐẦU MÀN HÌNH */
    .quick-export-bar {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 8px;
    }
    .btn-quick {
      border: none;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-quick:active { opacity: 0.75; }
    .btn-today-only { background: var(--card2); border: 1px solid rgba(10, 132, 255, 0.45); color: #64D2FF; }
    .btn-batch-week { background: linear-gradient(135deg, #0A84FF, #30D158); color: #fff; }

    /* KHUNG TRANG ĐỘC LẬP */
    .screen { flex: 1; overflow-y: auto; display: none; padding: 14px 16px calc(env(safe-area-inset-bottom, 20px) + 20px); }
    .screen.active { display: block; }

    .section-card {
      background: var(--card);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 14px;
      border: 0.5px solid var(--border);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .section-title { font-size: 15px; font-weight: 700; }
    .hint-badge {
      font-size: 11px;
      background: rgba(10, 132, 255, 0.18);
      color: #64D2FF;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    /* LƯỚI LỊCH CHỌN NHÓM NGÀY */
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-nav-btn { background: var(--card2); border: none; color: #fff; width: 32px; height: 32px; border-radius: 9px; font-size: 16px; font-weight: 700; }
    .cal-month-label { font-size: 15px; font-weight: 700; }

    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11.5px; color: var(--sub); font-weight: 600; margin-bottom: 6px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 5px; }
    
    .cal-cell {
      height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      font-size: 14.5px;
      font-weight: 500;
      border-radius: 10px;
    }
    .cal-cell.other-month { opacity: 0.25; }
    .cal-cell.in-range { background: rgba(10, 132, 255, 0.28); border-radius: 0; }
    .cal-cell.range-start { background: var(--accent); color: #fff; font-weight: 700; border-radius: 10px 0 0 10px; }
    .cal-cell.range-end { background: var(--accent); color: #fff; font-weight: 700; border-radius: 0 10px 10px 0; }
    .cal-cell.range-single { background: var(--accent); color: #fff; font-weight: 700; border-radius: 10px; }
    .cal-cell.real-today { box-shadow: inset 0 0 0 1.5px var(--green); }
    .lunar-mini { font-size: 8.5px; color: #FF9F0A; font-weight: 700; line-height: 1; margin-top: 1px; }
    .cal-cell.range-start .lunar-mini, .cal-cell.range-end .lunar-mini, .cal-cell.range-single .lunar-mini { color: #FFF; }
    .dot-row { display: flex; gap: 2px; margin-top: 2px; }
    .mini-dot { width: 4px; height: 4px; border-radius: 50%; }

    .range-status-bar {
      margin-top: 10px;
      padding: 9px 12px;
      background: var(--card2);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    /* FORM TÁCH GIỜ BẮT ĐẦU & GIỜ KẾT THÚC */
    .time-split-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .time-box {
      flex: 1;
      background: var(--card2);
      padding: 7px 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .time-box label { font-size: 10.5px; color: var(--sub); font-weight: 600; text-transform: uppercase; }
    input[type="time"] {
      background: transparent;
      border: none;
      color: #FFF;
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      outline: none;
      width: 100%;
    }
    .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] {
      background: var(--card2);
      border: 1px solid transparent;
      color: #fff;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .color-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
    .color-palette { display: flex; gap: 10px; }
    .c-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; }
    .c-swatch.active { border-color: #fff; transform: scale(1.12); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:active { opacity: 0.8; }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: var(--card2);
      border-radius: 10px;
      margin-top: 7px;
      border-left: 4px solid var(--accent);
    }
    .event-meta { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
    .btn-del { background: rgba(255,69,58,0.2); color: #FF453A; border: none; padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; }

    /* MÀN HÌNH 2: XEM TRƯỚC & CĂN VỊ TRÍ (LƯU CẤU HÌNH 1 LẦN) */
    .studio-wrapper { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .lockscreen-frame {
      width: 286px;
      height: 620px;
      border-radius: 42px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 5px #2C2C2E, 0 18px 40px rgba(0,0,0,0.85);
      background: #111;
      flex-shrink: 0;
    }
    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-image: linear-gradient(180deg, #1e232a 0%, #121519 55%, #090a0c 100%);
    }
    .bg-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); }
    .ios-top-hud {
      position: absolute;
      top: 10px; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 3;
    }
    .dynamic-island { width: 82px; height: 24px; background: #000; border-radius: 20px; margin-bottom: 12px; }
    .hud-date { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
    .hud-clock { font-size: 58px; font-weight: 700; line-height: 1.02; color: rgba(255,255,255,0.68); letter-spacing: -1.5px; }
    .hud-widgets {
      width: 86%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      color: rgba(255,255,255,0.8);
      font-size: 10px;
      font-weight: 600;
    }
    #gpuAgendaLayer {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 0;
      will-change: transform;
      z-index: 2;
      pointer-events: none;
    }
    .studio-controls {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 0.5px solid var(--border);
    }
    .slider-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--sub); }
    .slider-row span { min-width: 72px; font-weight: 500; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
  </style>
</head>
<body>

  <!-- THANH ĐIỀU HƯỚNG + NÚT XUẤT NHANH 1 CHẠM (KHÔNG CẦN VÀO XEM TRƯỚC) -->
  <div class="top-nav">
    <div class="mode-switch">
      <button class="mode-btn active" id="btnModePlan" onclick="switchScreen('plan')">📅 Lịch & Ghi chú</button>
      <button class="mode-btn" id="btnModePreview" onclick="switchScreen('preview')">📱 Căn chỉnh Nền & Vị trí</button>
    </div>
    <div class="quick-export-bar">
      <button class="btn-quick btn-today-only" onclick="exportSingleToday()">⚡ Xuất Hôm nay</button>
      <button class="btn-quick btn-batch-week" id="btnBatchExport" onclick="exportBatch7Days()">🔄 Xuất 7 ngày (Tự nhảy ngày)</button>
    </div>
  </div>

  <!-- ================= MÀN HÌNH 1: LỊCH CHỌN NHÓM NGÀY & GHI CHÚ ================= -->
  <div class="screen active" id="screen-plan">
    
    <div class="section-card">
      <div class="section-header">
        <span class="section-title">Chọn ngày / Nhóm ngày</span>
        <span class="hint-badge">Viền xanh lá = Hôm nay</span>
      </div>

      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="cal-month-label" id="calMonthTitle">Tháng 11 • 2026</div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
      </div>

      <div class="cal-weekdays">
        <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
      </div>
      <div class="cal-grid" id="interactiveCalGrid"></div>

      <div class="range-status-bar">
        <div>
          <span style="color:var(--sub);">Đang chọn: </span>
          <strong style="color:#64D2FF;" id="selectedRangeText">Hôm nay</strong>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <span class="section-title">Thêm việc vào ngày đã chọn</span>
      </div>

      <div class="time-split-row">
        <div class="time-box">
          <label>Giờ bắt đầu</label>
          <input type="time" id="evStartTime" value="08:00">
        </div>
        <span style="color:var(--sub); font-weight:700;">➔</span>
        <div class="time-box">
          <label>Giờ kết thúc</label>
          <input type="time" id="evEndTime" value="10:00">
        </div>
      </div>

      <div class="input-row">
        <input type="text" id="evTitle" placeholder="Nhập nội dung công việc..." maxlength="28">
      </div>

      <div class="color-row">
        <span style="font-size:13px; color:var(--sub);">Màu thẻ:</span>
        <div class="color-palette">
          <div class="c-swatch active" style="background:#3897F0;" onclick="selectColor('#3897F0', this)"></div>
          <div class="c-swatch" style="background:#5AC8FA;" onclick="selectColor('#5AC8FA', this)"></div>
          <div class="c-swatch" style="background:#34C759;" onclick="selectColor('#34C759', this)"></div>
          <div class="c-swatch" style="background:#FFD60A;" onclick="selectColor('#FFD60A', this)"></div>
          <div class="c-swatch" style="background:#FF9F0A;" onclick="selectColor('#FF9F0A', this)"></div>
          <div class="c-swatch" style="background:#FF6961;" onclick="selectColor('#FF6961', this)"></div>
          <div class="c-swatch" style="background:#BF5AF2;" onclick="selectColor('#BF5AF2', this)"></div>
        </div>
      </div>

      <button class="btn-primary" onclick="addEventToRange()">+ Lưu công việc</button>

      <div style="margin-top: 14px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12.5px; font-weight:600; color:var(--sub);" id="weekListTitle">Lịch trình tuần này</span>
          <button onclick="clearAllEvents()" style="background:none; border:none; color:#FF453A; font-size:12px;">Xóa hết</button>
        </div>
        <div id="eventsListContainer"></div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <span class="section-title" style="color:#FF9F0A;">Reminders (Ghi chú cố định)</span>
      </div>
      <div class="input-row">
        <input type="text" id="remInput" placeholder="VD: Mang pin dự phòng, thẻ nhớ...">
        <button class="btn-primary" style="width:85px; flex-shrink:0;" onclick="addReminder()">Thêm</button>
      </div>
      <div id="remindersListContainer"></div>
    </div>

  </div>

  <!-- ================= MÀN HÌNH 2: CĂN CHỈNH NỀN & VỊ TRÍ (TỰ LƯU) ================= -->
  <div class="screen" id="screen-preview">
    <div class="studio-wrapper">
      
      <div class="lockscreen-frame">
        <div class="bg-layer" id="previewBgLayer"></div>
        <div class="bg-dim" id="previewDimLayer"></div>

        <div class="ios-top-hud">
          <div class="dynamic-island"></div>
          <div class="hud-date" id="hudDateStr">Today</div>
          <div class="hud-clock">10:21</div>
          <div class="hud-widgets">
            <div>☀️ 28° Mostly Sunny</div>
            <div>🔋 92%</div>
          </div>
        </div>

        <div id="gpuAgendaLayer"></div>
      </div>

      <div class="studio-controls">
        <div class="slider-row">
          <span>Vị trí dọc</span>
          <input type="range" id="sliderY" min="180" max="320" value="230" oninput="saveLayoutSettings()">
        </div>
        <div class="slider-row">
          <span>Độ tối nền</span>
          <input type="range" id="sliderDim" min="0" max="80" value="38" oninput="saveLayoutSettings()">
        </div>
        <input type="file" id="bgFileInput" accept="image/*" style="display:none;" onchange="handleBgUpload(event)">
        <button class="btn-primary" style="background:var(--card2);" onclick="document.getElementById('bgFileInput').click()">🖼️ Đổi ảnh nền gốc (Tự động lưu)</button>
      </div>

    </div>
  </div>

  <canvas id="exportCanvas" width="1290" height="2796" style="display:none;"></canvas>

<script>
// ================= 1. THUẬT TOÁN ÂM LỊCH (MÙNG 1 & 29/30) =================
function jdFromDate(d, m, y) {
  const a = Math.floor((14 - m) / 12);
  const y2 = y + 4800 - a;
  const m2 = m + 12 * a - 3;
  return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
}
function getNewMoonDay(k, timeZone = 7) {
  const T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = Math.PI / 180;
  let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
  Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
  const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
  const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
  const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
  const C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
  const C2 = -0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(2 * dr * Mpr);
  const C3 = -0.0051 * Math.sin((M + Mpr) * dr);
  const C4 = 0.0104 * Math.sin(2 * F * dr) - 0.0074 * Math.sin((M - Mpr) * dr) - 0.0004 * Math.sin(2 * F * dr + M * dr);
  return Math.floor(Jd1 + C1 + C2 + C3 + C4 + 0.5 + timeZone / 24);
}
function getLunarSpecialLabel(dateObj) {
  const d = dateObj.getDate(), m = dateObj.getMonth() + 1, y = dateObj.getFullYear();
  const currentJd = jdFromDate(d, m, y);
  const k = Math.floor((currentJd - 2415021.076998695) / 29.530588853);
  let nm = getNewMoonDay(k);
  if (nm > currentJd) nm = getNewMoonDay(k - 1);
  let nextNm = getNewMoonDay(k + 1);
  if (nextNm <= currentJd) nextNm = getNewMoonDay(k + 2);
  const lunarDay = currentJd - nm + 1;
  const daysInLunarMonth = nextNm - nm;
  if (lunarDay === 1) return 'M.1';
  if (lunarDay === daysInLunarMonth) return String(lunarDay);
  return '';
}

// ================= 2. QUẢN LÝ NGÀY THỰC TẾ & DỮ LIỆU =================
const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromISO = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

function getRealTodayISO() {
  return toISO(new Date());
}

let todayDate = new Date();
let viewYear = todayDate.getFullYear();
let viewMonth = todayDate.getMonth();

let rangeStartISO = getRealTodayISO();
let rangeEndISO = getRealTodayISO();
let isSelectingSecondTap = false;
let selectedColor = '#3897F0';

let customBgDataUrl = localStorage.getItem('ls_bg_img') || null;
let savedY = localStorage.getItem('ls_pos_y') || '230';
let savedDim = localStorage.getItem('ls_dim') || '38';
document.getElementById('sliderY').value = savedY;
document.getElementById('sliderDim').value = savedDim;

let eventsData = JSON.parse(localStorage.getItem('ls_week_events') || '[]');
let remindersData = JSON.parse(localStorage.getItem('ls_week_reminders') || '[]');

function getMondayOfWeek(d) {
  const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = copy.getDay();
  const diff = copy.getDate() - day + (day === 0 ? -6 : 1);
  copy.setDate(diff);
  return copy;
}

// Tự động cập nhật lại ngày thực tế mỗi khi mở lại App từ màn hình chính
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    renderInteractiveCalendar();
    renderEventsList();
  }
});

function switchScreen(mode) {
  document.getElementById('btnModePlan').classList.toggle('active', mode === 'plan');
  document.getElementById('btnModePreview').classList.toggle('active', mode === 'preview');
  document.getElementById('screen-plan').classList.toggle('active', mode === 'plan');
  document.getElementById('screen-preview').classList.toggle('active', mode === 'preview');
  if (mode === 'preview') {
    renderLockscreenPreviewDOM(getRealTodayISO());
    updateGpuPosition();
  }
}

// ================= 3. LỊCH CHỌN NHÓM NGÀY (KHÔNG LÀM LỆCH NGÀY HÔM NAY) =================
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderInteractiveCalendar();
}

function onTapCalendarDate(iso) {
  if (!isSelectingSecondTap) {
    rangeStartISO = iso;
    rangeEndISO = iso;
    isSelectingSecondTap = true;
  } else {
    if (iso < rangeStartISO) {
      rangeEndISO = rangeStartISO;
      rangeStartISO = iso;
    } else {
      rangeEndISO = iso;
    }
    isSelectingSecondTap = false;
  }
  renderInteractiveCalendar();
  renderEventsList();
}

function fmtShortVN(iso) {
  const [,m,d] = iso.split('-');
  return `${d}/${m}`;
}

function renderInteractiveCalendar() {
  document.getElementById('calMonthTitle').textContent = `Tháng ${viewMonth + 1} • ${viewYear}`;
  const grid = document.getElementById('interactiveCalGrid');
  grid.innerHTML = '';

  const realToday = getRealTodayISO();
  const firstDay = new Date(viewYear, viewMonth, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell other-month';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const cellDate = new Date(viewYear, viewMonth, d);
    const iso = toISO(cellDate);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    if (iso === rangeStartISO && iso === rangeEndISO) cell.classList.add('range-single');
    else if (iso === rangeStartISO) cell.classList.add('range-start');
    else if (iso === rangeEndISO) cell.classList.add('range-end');
    else if (iso > rangeStartISO && iso < rangeEndISO) cell.classList.add('in-range');

    if (iso === realToday) cell.classList.add('real-today');

    const lunarLabel = getLunarSpecialLabel(cellDate);
    const dayEvents = eventsData.filter(e => iso >= e.start && iso <= e.end);
    const dotsHtml = dayEvents.slice(0, 4).map(e => `<span class="mini-dot" style="background:${e.color}"></span>`).join('');

    cell.innerHTML = `
      <span>${d}</span>
      ${lunarLabel ? `<span class="lunar-mini">${lunarLabel}</span>` : ''}
      ${dotsHtml ? `<div class="dot-row">${dotsHtml}</div>` : ''}
    `;
    cell.onclick = () => onTapCalendarDate(iso);
    grid.appendChild(cell);
  }

  const labelEl = document.getElementById('selectedRangeText');
  if (rangeStartISO === rangeEndISO) {
    labelEl.textContent = `${fmtShortVN(rangeStartISO)} (Chạm ngày thứ 2 nếu muốn nối chuỗi ngày)`;
  } else {
    labelEl.textContent = `${fmtShortVN(rangeStartISO)} ➔ ${fmtShortVN(rangeEndISO)}`;
  }
}

// ================= 4. QUẢN LÝ CÔNG VIỆC & REMINDERS =================
function selectColor(color, el) {
  selectedColor = color;
  document.querySelectorAll('.c-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function addEventToRange() {
  const startT = document.getElementById('evStartTime').value;
  const endT = document.getElementById('evEndTime').value;
  const timeStr = (startT && endT) ? `${startT}–${endT}` : (startT || 'Cả ngày');
  const titleStr = document.getElementById('evTitle').value.trim();

  if (!titleStr) return alert('Bạn hãy nhập nội dung công việc nhé!');

  eventsData.push({
    id: String(Date.now()),
    start: rangeStartISO,
    end: rangeEndISO,
    time: timeStr,
    title: titleStr,
    color: selectedColor
  });

  localStorage.setItem('ls_week_events', JSON.stringify(eventsData));
  document.getElementById('evTitle').value = '';
  isSelectingSecondTap = false;
  renderInteractiveCalendar();
  renderEventsList();
}

function deleteEvent(id) {
  eventsData = eventsData.filter(e => e.id !== id);
  localStorage.setItem('ls_week_events', JSON.stringify(eventsData));
  renderInteractiveCalendar();
  renderEventsList();
}

function clearAllEvents() {
  eventsData = [];
  localStorage.setItem('ls_week_events', JSON.stringify(eventsData));
  renderInteractiveCalendar();
  renderEventsList();
}

function renderEventsList() {
  const container = document.getElementById('eventsListContainer');
  const monday = getMondayOfWeek(fromISO(rangeStartISO));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const wStart = toISO(monday), wEnd = toISO(sunday);

  document.getElementById('weekListTitle').textContent =
    `Lịch trình tuần (${fmtShortVN(wStart)} – ${fmtShortVN(wEnd)})`;

  const list = eventsData.filter(e => !(e.end < wStart || e.start > wEnd));
  if (list.length === 0) {
    container.innerHTML = `<div style="font-size:13px; color:var(--sub); padding:8px 0;">Chưa có sự kiện nào trong tuần này.</div>`;
    return;
  }

  container.innerHTML = list.map(e => {
    const rangeTag = (e.start === e.end) ? fmtShortVN(e.start) : `${fmtShortVN(e.start)} ➔ ${fmtShortVN(e.end)}`;
    return `
      <div class="event-item" style="border-left-color:${e.color}">
        <div>
          <div style="font-size:14px; font-weight:600;">${e.title}</div>
          <div class="event-meta">${e.time} • ${rangeTag}</div>
        </div>
        <button class="btn-del" onclick="deleteEvent('${e.id}')">Xóa</button>
      </div>
    `;
  }).join('');
}

function addReminder() {
  const inp = document.getElementById('remInput');
  const val = inp.value.trim();
  if (!val) return;
  remindersData.push(val);
  localStorage.setItem('ls_week_reminders', JSON.stringify(remindersData));
  inp.value = '';
  renderRemindersList();
}

function deleteReminder(idx) {
  remindersData.splice(idx, 1);
  localStorage.setItem('ls_week_reminders', JSON.stringify(remindersData));
  renderRemindersList();
}

function renderRemindersList() {
  const box = document.getElementById('remindersListContainer');
  box.innerHTML = remindersData.map((r, idx) => `
    <div class="event-item" style="border-left-color:#FF9F0A">
      <div style="font-size:14px;">${r}</div>
      <button class="btn-del" onclick="deleteReminder(${idx})">Xóa</button>
    </div>
  `).join('');
}

// ================= 5. CĂN CHỈNH & LƯU BỐ CỤC =================
function handleBgUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    customBgDataUrl = ev.target.result;
    try { localStorage.setItem('ls_bg_img', customBgDataUrl); } catch(err) {}
    applyBgPreview();
  };
  reader.readAsDataURL(file);
}

function applyBgPreview() {
  const bgEl = document.getElementById('previewBgLayer');
  if (customBgDataUrl) bgEl.style.backgroundImage = `url(${customBgDataUrl})`;
}

function saveLayoutSettings() {
  localStorage.setItem('ls_pos_y', document.getElementById('sliderY').value);
  localStorage.setItem('ls_dim', document.getElementById('sliderDim').value);
  updateGpuPosition();
}

function updateGpuPosition() {
  const y = document.getElementById('sliderY').value;
  const dim = document.getElementById('sliderDim').value / 100;
  document.getElementById('gpuAgendaLayer').style.transform = `translate3d(0, ${y}px, 0)`;
  document.getElementById('previewDimLayer').style.background = `rgba(0,0,0,${dim})`;
}

function renderLockscreenPreviewDOM(targetISO) {
  applyBgPreview();
  const focusDate = fromISO(targetISO);
  const monday = getMondayOfWeek(focusDate);
  const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const dowIndex = (focusDate.getDay() + 6) % 7;
  document.getElementById('hudDateStr').textContent = `${dayNames[dowIndex]} ${focusDate.getDate()} ${monthNames[focusDate.getMonth()]}`;

  let weekColsHtml = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = toISO(d);
    const isFocus = (iso === targetISO);
    const lunarBadge = getLunarSpecialLabel(d);
    const dayEvs = eventsData.filter(e => iso >= e.start && iso <= e.end)
                              .sort((a,b) => a.time.localeCompare(b.time));

    const pillsHtml = dayEvs.slice(0, 4).map(ev => {
      const darkText = (ev.color === '#FFD60A' || ev.color === '#5AC8FA');
      return `
        <div style="background:${ev.color}; color:${darkText ? '#000' : '#fff'}; border-radius:3px; padding:1.5px 2px; margin-bottom:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;">
          <div style="font-size:5.5px; font-weight:700; opacity:0.9; line-height:1.1;">${ev.time}</div>
          <div style="font-size:6px; font-weight:700; line-height:1.15; overflow:hidden; text-overflow:ellipsis;">${ev.title}</div>
        </div>
      `;
    }).join('');

    weekColsHtml += `
      <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
        <div style="text-align:center; margin-bottom:4px;">
          <div style="font-size:9px; color:${isFocus ? '#fff' : 'rgba(255,255,255,0.75)'}; font-weight:${isFocus ? '700' : '500'};">${dayNames[i]}</div>
          <div style="font-size:10px; font-weight:700; color:${isFocus ? '#0A84FF' : '#fff'};">
            ${d.getDate()}${lunarBadge ? `<span style="font-size:7px; color:#FF9F0A; margin-left:1px;">(${lunarBadge})</span>` : ''}
          </div>
        </div>
        <div>${pillsHtml}</div>
      </div>
    `;
  }

  const todayEvs = eventsData.filter(e => targetISO >= e.start && targetISO <= e.end)
                             .sort((a,b) => a.time.localeCompare(b.time));

  const todayRowsHtml = todayEvs.length > 0 ? todayEvs.map(ev => `
    <div style="display:flex; align-items:baseline; gap:12px; margin-top:5px; font-size:11.5px; font-weight:600;">
      <div style="color:rgba(255,255,255,0.92); min-width:74px; font-variant-numeric:tabular-nums;">${ev.time}</div>
      <div style="color:${ev.color}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ev.title}</div>
    </div>
  `).join('') : `<div style="font-size:11px; color:rgba(255,255,255,0.5); margin-top:4px;">Không có lịch trình</div>`;

  const remindersHtml = remindersData.length > 0 ? `
    <div style="margin-top:12px;">
      <div style="font-size:12px; font-weight:700; color:#FF9F0A; margin-bottom:3px;">Reminders</div>
      ${remindersData.map(r => `<div style="font-size:11.5px; font-weight:600; color:#fff; margin-top:2px;">${r}</div>`).join('')}
    </div>
  ` : '';

  document.getElementById('gpuAgendaLayer').innerHTML = `
    <div style="display:flex; gap:3px; margin-bottom:14px;">${weekColsHtml}</div>
    <div>
      <div style="font-size:13.5px; font-weight:700; color:#fff; margin-bottom:2px;">Today</div>
      ${todayRowsHtml}
    </div>
    ${remindersHtml}
  `;
}

// ================= 6. ENGINE VẼ LÊN CANVAS CHO 1 NGÀY BẤT KỲ =================
async function renderDayToBlob(targetISO, preloadedBgImg) {
  const canvas = document.getElementById('exportCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scaleFactor = H / 620;

  if (preloadedBgImg) {
    const s = Math.max(W / preloadedBgImg.width, H / preloadedBgImg.height);
    ctx.drawImage(preloadedBgImg, (W - preloadedBgImg.width * s) / 2, (H - preloadedBgImg.height * s) / 2, preloadedBgImg.width * s, preloadedBgImg.height * s);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1e232a');
    grad.addColorStop(0.55, '#121519');
    grad.addColorStop(1, '#090a0c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  const dim = document.getElementById('sliderDim').value / 100;
  ctx.fillStyle = `rgba(0,0,0,${dim})`;
  ctx.fillRect(0, 0, W, H);

  const startY = parseInt(document.getElementById('sliderY').value, 10) * scaleFactor;
  const padX = 72;
  const contentW = W - padX * 2;
  const colGap = 14;
  const colW = (contentW - colGap * 6) / 7;

  const focusDate = fromISO(targetISO);
  const monday = getMondayOfWeek(focusDate);
  const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  let maxWeekBottomY = startY + 120;

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = toISO(d);
    const isFocus = (iso === targetISO);
    const lunarBadge = getLunarSpecialLabel(d);
    const colX = padX + i * (colW + colGap);

    // Vẽ khung sáng nhẹ cho cột ngày Hôm nay
    if (isFocus) {
      ctx.fillStyle = 'rgba(10, 132, 255, 0.22)';
      ctx.beginPath();
      ctx.roundRect(colX - 4, startY - 38, colW + 8, 98, 14);
      ctx.fill();
    }

    ctx.font = `${isFocus ? '700' : '500'} 40px -apple-system, sans-serif`;
    ctx.fillStyle = isFocus ? '#FFFFFF' : 'rgba(255,255,255,0.78)';
    ctx.textAlign = 'center';
    ctx.fillText(dayNames[i], colX + colW / 2, startY);

    const dayLabel = lunarBadge ? `${d.getDate()} (${lunarBadge})` : `${d.getDate()}`;
    ctx.font = `700 ${lunarBadge ? '34px' : '42px'} -apple-system, sans-serif`;
    ctx.fillStyle = isFocus ? '#0A84FF' : (lunarBadge ? '#FF9F0A' : '#FFFFFF');
    ctx.fillText(dayLabel, colX + colW / 2, startY + 48);

    const dayEvs = eventsData.filter(e => iso >= e.start && iso <= e.end)
                              .sort((a,b) => a.time.localeCompare(b.time));
    let pillY = startY + 70;
    dayEvs.slice(0, 4).forEach(ev => {
      const pillH = 68;
      ctx.fillStyle = ev.color;
      ctx.beginPath();
      ctx.roundRect(colX, pillY, colW, pillH, 12);
      ctx.fill();

      const darkText = (ev.color === '#FFD60A' || ev.color === '#5AC8FA');
      ctx.fillStyle = darkText ? '#000000' : '#FFFFFF';
      ctx.textAlign = 'left';

      ctx.font = '700 22px -apple-system, sans-serif';
      ctx.fillText(ev.time.slice(0, 11), colX + 10, pillY + 26);

      ctx.font = '700 24px -apple-system, sans-serif';
      let shortTitle = ev.title;
      if (shortTitle.length > 10) shortTitle = shortTitle.slice(0, 9) + '…';
      ctx.fillText(shortTitle, colX + 10, pillY + 54);

      pillY += pillH + 10;
    });

    if (pillY > maxWeekBottomY) maxWeekBottomY = pillY;
  }

  let curY = maxWeekBottomY + 75;
  ctx.textAlign = 'left';
  ctx.font = '700 62px -apple-system, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(`Today (${fmtShortVN(targetISO)})`, padX, curY);

  curY += 68;
  const todayEvs = eventsData.filter(e => targetISO >= e.start && targetISO <= e.end)
                             .sort((a,b) => a.time.localeCompare(b.time));

  if (todayEvs.length === 0) {
    ctx.font = '500 46px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('Không có lịch trình', padX, curY);
    curY += 60;
  } else {
    todayEvs.forEach(ev => {
      ctx.font = '600 50px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillText(ev.time, padX, curY);

      ctx.fillStyle = ev.color;
      ctx.fillText(ev.title, padX + 350, curY);
      curY += 72;
    });
  }

  if (remindersData.length > 0) {
    curY += 35;
    ctx.font = '700 56px -apple-system, sans-serif';
    ctx.fillStyle = '#FF9F0A';
    ctx.fillText('Reminders', padX, curY);
    curY += 66;

    ctx.font = '600 50px -apple-system, sans-serif';
    ctx.fillStyle = '#FFFFFF';
    remindersData.forEach(r => {
      ctx.fillText(r, padX, curY);
      curY += 66;
    });
  }

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));
}

async function loadBgImageObj() {
  if (!customBgDataUrl) return null;
  const img = new Image();
  img.src = customBgDataUrl;
  await new Promise(res => { img.onload = res; img.onerror = res; });
  return img;
}

// XUẤT 1 CHẠM RIÊNG NGÀY HÔM NAY
async function exportSingleToday() {
  const realToday = getRealTodayISO();
  const bgImg = await loadBgImageObj();
  const blob = await renderDayToBlob(realToday, bgImg);
  const file = new File([blob], `${realToday}.png`, { type: 'image/png' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(() => {});
  }
}

// XUẤT GÓI 7 NGÀY LIÊN TIẾP (TỰ ĐỘNG NHẢY NGÀY TRÊN IPHONE)
async function exportBatch7Days() {
  const btn = document.getElementById('btnBatchExport');
  const oldText = btn.textContent;
  btn.textContent = '⏳ Đang tạo 7 ngày...';

  const bgImg = await loadBgImageObj();
  const files = [];
  const baseDate = new Date();

  for (let i = 0; i < 7; i++) {
    const d = new Date(baseDate);
    d.setDate(baseDate.getDate() + i);
    const iso = toISO(d);
    const blob = await renderDayToBlob(iso, bgImg);
    files.push(new File([blob], `${iso}.png`, { type: 'image/png' }));
  }

  btn.textContent = oldText;

  if (navigator.share && navigator.canShare && navigator.canShare({ files })) {
    navigator.share({ files }).catch(() => {});
  } else {
    alert('Trình duyệt không hỗ trợ chia sẻ nhiều tệp.');
  }
}

renderInteractiveCalendar();
renderEventsList();
renderRemindersList();
