<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lockscreen Pro Planner</title>
  <style>
    :root { 
      --ios-bg: #000000; --ios-card: #1c1c1e; --ios-card-2: #2c2c2e; 
      --ios-accent: #0A84FF; --ios-text: #FFFFFF; --ios-subtext: #8E8E93;
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--ios-bg); color: var(--ios-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* HEADER (CHỌN THÁNG) */
    .header { padding: 50px 20px 15px; background: var(--ios-card); border-bottom: 0.5px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
    .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .month-selector { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 12px; border-radius: 8px; font-weight: 600; }

    /* TAB BARS */
    .tab-bar { display: flex; background: var(--ios-card); padding-bottom: var(--safe-bottom); border-top: 0.5px solid rgba(255,255,255,0.1); z-index: 10;}
    .tab-item { flex: 1; padding: 12px 0; text-align: center; color: var(--ios-subtext); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;}
    .tab-item.active { color: var(--ios-accent); }
    .tab-icon { font-size: 24px; }

    /* NỘI DUNG TABS */
    .page { flex: 1; overflow-y: auto; display: none; flex-direction: column; background: var(--ios-bg); }
    .page.active { display: flex; }

    /* PAGE 1: KẾ HOẠCH TRỰC QUAN */
    .planner-container { padding: 20px; }
    .card { background: var(--ios-card); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .form-group label { font-size: 13px; color: var(--ios-subtext); font-weight: 500; }
    .row-date { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type="text"], input[type="date"] { background: var(--ios-card-2); border: none; color: #fff; padding: 12px; border-radius: 10px; font-size: 15px; width: 100%; }
    
    .color-picker { display: flex; gap: 12px; margin-top: 5px; }
    .color-dot { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
    .color-dot.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
    
    .btn-add { background: var(--ios-accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 16px; width: 100%; margin-top: 10px; cursor: pointer;}
    .btn-add:active { opacity: 0.8; }

    /* DANH SÁCH CÔNG VIỆC */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: var(--ios-card); padding: 12px 16px; border-radius: 12px; }
    .task-info { display: flex; flex-direction: column; gap: 4px; }
    .task-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px;}
    .task-date { font-size: 13px; color: var(--ios-subtext); }
    .task-dot { width: 10px; height: 10px; border-radius: 50%; }
    .btn-delete { background: rgba(255,69,58,0.15); color: #FF453A; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }

    /* PAGE 2: XEM TRƯỚC (CANVAS) */
    .preview-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px; overflow-y: auto;}
    .phone-stage { width: 260px; height: 563px; /* Tỷ lệ 9:19.5 thu nhỏ */ border-radius: 36px; position: relative; overflow: hidden; box-shadow: 0 0 0 6px #2c2c2e; flex-shrink: 0;}
    #wallpaperCanvas { width: 100%; height: 100%; object-fit: cover; }
    .ios-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
    .dynamic-island { width: 80px; height: 24px; background: #000; border-radius: 20px; margin-top: 8px; }
    .ios-clock { font-size: 50px; font-weight: 700; margin-top: 25px; letter-spacing: -1.5px; color: rgba(255,255,255,0.9); }
    
    .editor-controls { width: 100%; background: var(--ios-card); padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; }
    .control-row { display: flex; align-items: center; gap: 15px; }
    .control-row label { font-size: 14px; font-weight: 500; color: var(--ios-subtext); min-width: 60px; }
    input[type="range"] { flex: 1; accent-color: var(--ios-accent); height: 6px; }
    
    .btn-action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .btn-action { padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-secondary { background: var(--ios-card-2); color: #fff; }
    .btn-primary { background: var(--ios-accent); color: #fff; grid-column: span 2; }
  </style>
</head>
<body>

  <!-- HEADER DÙNG CHUNG -->
  <div class="header">
    <h1>Lịch Khóa</h1>
    <input type="month" id="monthPicker" class="month-selector">
  </div>

  <!-- TAB 1: KẾ HOẠCH CÔNG VIỆC -->
  <div id="page-planner" class="page active">
    <div class="planner-container">
      
      <!-- Form thêm công việc -->
      <div class="card">
        <div class="form-group">
          <label>Nội dung sự kiện (Tối đa 15 ký tự)</label>
          <input type="text" id="taskTitle" placeholder="VD: Khảo sát dự án" maxlength="15">
        </div>
        
        <div class="row-date">
          <div class="form-group">
            <label>Từ ngày</label>
            <input type="date" id="taskStart">
          </div>
          <div class="form-group">
            <label>Đến ngày</label>
            <input type="date" id="taskEnd">
          </div>
        </div>

        <div class="form-group">
          <label>Phân loại màu</label>
          <div class="color-picker">
            <div class="color-dot active" style="background: #32D74B;" onclick="pickColor('#32D74B', this)"></div> <!-- Xanh lá -->
            <div class="color-dot" style="background: #FF9F0A;" onclick="pickColor('#FF9F0A', this)"></div> <!-- Cam -->
            <div class="color-dot" style="background: #FF453A;" onclick="pickColor('#FF453A', this)"></div> <!-- Đỏ -->
            <div class="color-dot" style="background: #0A84FF;" onclick="pickColor('#0A84FF', this)"></div> <!-- Xanh dương -->
            <div class="color-dot" style="background: #BF5AF2;" onclick="pickColor('#BF5AF2', this)"></div> <!-- Tím -->
          </div>
        </div>
        <button class="btn-add" onclick="addTask()">+ Thêm vào Lịch</button>
      </div>

      <h3 style="font-size: 16px; margin-bottom: 12px; color: var(--ios-subtext);">Sự kiện trong tháng này</h3>
      <div class="task-list" id="taskListUI">
        <!-- Danh sách render bằng JS -->
      </div>
    </div>
  </div>

  <!-- TAB 2: XEM TRƯỚC VÀ XUẤT ẢNH -->
  <div id="page-preview" class="page">
    <div class="preview-container">
      <!-- Khung mô phỏng iPhone -->
      <div class="phone-stage">
        <!-- Canvas nội tại xuất ảnh phân giải 1290x2796 -->
        <canvas id="wallpaperCanvas" width="1290" height="2796"></canvas>
        <div class="ios-overlay" id="iosOverlay">
          <div class="dynamic-island"></div>
          <div class="ios-clock">09:41</div>
        </div>
      </div>

      <!-- Bảng điều khiển tinh chỉnh -->
      <div class="editor-controls">
        <div class="control-row">
          <label>Vị trí</label>
          <input type="range" id="posY" min="500" max="1500" value="700">
        </div>
        <div class="control-row">
          <label>Độ mờ</label>
          <input type="range" id="cardOpacity" min="0" max="60" value="25">
        </div>

        <div class="btn-action-group">
          <input type="file" id="fileInput" accept="image/*" style="display:none;">
          <button class="btn-action btn-secondary" onclick="document.getElementById('fileInput').click()">🖼️ Đổi ảnh nền</button>
          <button class="btn-action btn-secondary" onclick="resetBg()">Xóa nền</button>
          <button class="btn-action btn-primary" onclick="exportToLockscreen()">⇡ Đặt làm Hình nền</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NATIVE TABS -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('planner', this)">
      <span class="tab-icon">📝</span>
      <span>Công việc</span>
    </div>
    <div class="tab-item" onclick="switchTab('preview', this)">
      <span class="tab-icon">📱</span>
      <span>Xem trước</span>
    </div>
  </div>

<script>
// BIẾN TOÀN CỤC & LOCAL STORAGE
const canvas = document.getElementById('wallpaperCanvas');
const ctx = canvas.getContext('2d');
let bgImage = null;
let activeColor = '#32D74B';
let isRendering = false; // Flag chống lag

// Lấy dữ liệu công việc (Định dạng: mảng các object)
let tasks = JSON.parse(localStorage.getItem('lockscreen_tasks') || '[]');

// Khởi tạo ngày hôm nay
const now = new Date();
document.getElementById('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
document.getElementById('taskStart').value = now.toISOString().split('T')[0];
document.getElementById('taskEnd').value = now.toISOString().split('T')[0];

// HÀM CHUYỂN TAB
function switchTab(tabId, el) {
  document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`page-${tabId}`).classList.add('active');
  
  if (tabId === 'preview') requestRender(); // Chỉ kết xuất đồ họa khi xem trước
}

function pickColor(color, el) {
  activeColor = color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

// LOGIC CÔNG VIỆC
function addTask() {
  const title = document.getElementById('taskTitle').value.trim();
  const start = document.getElementById('taskStart').value;
  const end = document.getElementById('taskEnd').value;
  
  if (!title) return alert("Vui lòng nhập tên công việc");
  if (start > end) return alert("Ngày bắt đầu không được lớn hơn ngày kết thúc");

  tasks.push({
    id: Date.now().toString(),
    title: title,
    start: start,
    end: end,
    color: activeColor
  });

  saveAndRefresh();
  document.getElementById('taskTitle').value = ''; // Reset form
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveAndRefresh();
}

function saveAndRefresh() {
  localStorage.setItem('lockscreen_tasks', JSON.stringify(tasks));
  renderTaskList();
  requestRender();
}

// RENDER DANH SÁCH RA HTML (Tab 1)
function renderTaskList() {
  const listUI = document.getElementById('taskListUI');
  const [yyyy, mm] = document.getElementById('monthPicker').value.split('-');
  const targetMonth = `${yyyy}-${mm}`;

  listUI.innerHTML = '';
  // Chỉ hiện việc của tháng đang chọn
  const currentTasks = tasks.filter(t => t.start.startsWith(targetMonth) || t.end.startsWith(targetMonth));
  
  if (currentTasks.length === 0) {
    listUI.innerHTML = '<div style="text-align:center; color:#8E8E93; font-size:14px; margin-top:20px;">Tháng này chưa có lịch trình.</div>';
    return;
  }

  // Sắp xếp theo ngày bắt đầu
  currentTasks.sort((a,b) => a.start.localeCompare(b.start)).forEach(t => {
    // Định dạng lại ngày để hiển thị đẹp (VD: 15/11 -> 17/11)
    const fmt = d => `${d.split('-')[2]}/${d.split('-')[1]}`;
    const dateStr = (t.start === t.end) ? fmt(t.start) : `${fmt(t.start)} ➔ ${fmt(t.end)}`;
    
    listUI.innerHTML += `
      <div class="task-item">
        <div class="task-info">
          <div class="task-title">
            <div class="task-dot" style="background: ${t.color};"></div>
            ${t.title}
          </div>
          <div class="task-date">${dateStr}</div>
        </div>
        <button class="btn-delete" onclick="deleteTask('${t.id}')">Xóa</button>
      </div>
    `;
  });
}

// ĐỔI ẢNH NỀN
document.getElementById('fileInput').addEventListener('change', (e) => {
  if (!e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = ev => { const img = new Image(); img.onload = () => { bgImage = img; requestRender(); }; img.src = ev.target.result; };
  reader.readAsDataURL(e.target.files[0]);
});
function resetBg() { bgImage = null; requestRender(); }


// ENGINE CHỐNG LAG (THROTTLE RENDERING)
// Giúp slider Y mượt mà không bắt CPU vẽ lại quá nhanh
function requestRender() {
  if (!isRendering) {
    isRendering = true;
    requestAnimationFrame(() => {
      drawCanvas();
      isRendering = false;
    });
  }
}

// THUẬT TOÁN VẼ LÊN CANVAS ĐỘ PHÂN GIẢI CAO (Tab 2)
function drawCanvas() {
  const [yyyy, mm] = document.getElementById('monthPicker').value.split('-').map(Number);
  const startY = parseInt(document.getElementById('posY').value, 10);
  const opacity = parseInt(document.getElementById('cardOpacity').value, 10) / 100;
  
  // 1. Vẽ Nền
  if (bgImage) {
    const scale = Math.max(canvas.width / bgImage.width, canvas.height / bgImage.height);
    const x = (canvas.width - bgImage.width * scale) / 2, y = (canvas.height - bgImage.height * scale) / 2;
    ctx.drawImage(bgImage, x, y, bgImage.width * scale, bgImage.height * scale);
  } else {
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. Vẽ Tấm Kính Lịch
  const baseWidth = 1140, baseHeight = 900, boxX = (canvas.width - baseWidth) / 2, boxY = startY;
